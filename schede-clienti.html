<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Scheda Allenamento</title>
<style>
:root{--bg:#0f172a;--c:#1e293b;--b:#334155;--m:#94a3b8;--a:#10b981;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{background:var(--bg);color:#f8fafc;padding:14px;max-width:720px;margin:0 auto;line-height:1.4}
h2{font-size:1.2rem;margin:12px 0}h3{margin-bottom:8px}
.top{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--b)}.top img{height:84px;width:84px;border-radius:50%}.top b{font-size:1.05rem}
label{display:block;font-size:.8rem;color:var(--m);margin-bottom:10px}
input,select,textarea{width:100%;background:#0f172a;color:#fff;border:1px solid var(--b);border-radius:8px;padding:9px;font-size:.95rem;margin-top:4px}
textarea{height:90px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{margin-top:0}
.ex{padding:8px 0;border-top:1px solid var(--b)}
.s{width:56px;text-align:center}
button,.go,.add{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:.9rem;font-weight:600;text-decoration:none;text-align:center;cursor:pointer}
.go{display:block;background:var(--a);color:#052e16;width:100%;margin:12px 0}.row .go{margin:8px 0;flex:1}
.add{width:100%;background:transparent;border:1px dashed var(--b);color:var(--m);margin-top:8px}
.x{padding:6px 10px;color:#ef4444;background:transparent}
.tag{font-size:.7rem;background:var(--b);padding:2px 7px;border-radius:6px;color:var(--m)}.m{color:var(--m);font-size:.85rem}
.wk{justify-content:space-between}
.tg{margin-left:auto;font-size:.78rem;padding:3px 8px;border-radius:6px}.u{background:#064e3b;color:#6ee7b7}.d{background:#7f1d1d;color:#fca5a5}.n{background:var(--b);color:#cbd5e1}
.bars{display:flex;gap:8px;align-items:flex-end;margin-top:10px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}.bar i{display:block;width:100%;background:var(--a);border-radius:4px 4px 0 0}.bar small{font-size:.65rem;color:var(--m)}
</style>
</head>

  app.innerHTML = head(p.k) + `<h2>Crea scheda cliente</h2>
  <label>Il tuo nome / brand<input value="${esc(p.k)}" oninput="p.k=this.value;sv()"></label>
  <label>Nome e cognome del cliente<input value="${esc(p.c)}" oninput="p.c=this.value;sv()"></label>
  <label>Il cliente ti invia il report su<select onchange="p.t=this.value;sv();draw()"><option value="w" ${p.t == 'w' ? 'selected' : ''}>WhatsApp</option><option value="e" ${p.t == 'e' ? 'selected' : ''}>Email</option></select></label>
  <label>${p.t == 'w' ? 'Il tuo numero WhatsApp (con prefisso, es. 39333...)' : 'La tua email'}<input value="${esc(p.a)}" inputmode="${p.t == 'w' ? 'tel' : 'email'}" oninput="p.a=this.value;sv()"></label>`
  + p.d.map((d, i) => `<div class="card"><div class="row"><input value="${esc(d.n)}" oninput="p.d[${i}].n=this.value;sv()"><button class="x" onclick="p.d.splice(${i},1);sv();draw()">✕</button></div>`
    + d.e.map((x, j) => `<div class="ex"><input placeholder="Esercizio" value="${esc(x[0])}" oninput="p.d[${i}].e[${j}][0]=this.value;sv()"><div class="row" style="margin-top:6px"><select onchange="p.d[${i}].e[${j}][1]=this.value;sv()">${MUSC.map(m => `<option ${m == x[1] ? 'selected' : ''}>${m}</option>`).join('')}</select><input class="s" type="number" inputmode="numeric" value="${x[2]}" oninput="p.d[${i}].e[${j}][2]=+this.value;sv()"><span>×</span><input class="s" value="${esc(x[3])}" oninput="p.d[${i}].e[${j}][3]=this.value;sv()"><button class="x" onclick="p.d[${i}].e.splice(${j},1);sv();draw()">✕</button></div></div>`).join('')
    + `<button class="add" onclick="p.d[${i}].e.push(['','Petto',3,'10']);sv();draw()">+ Esercizio</button></div>`).join('')
  + `<button class="add" onclick="p.d.push({n:'Giorno '+(p.d.length+1),e:[]});sv();draw()">+ Giorno</button>
  <button class="go" onclick="mk()">Crea link per il cliente</button><div id="out"></div>
  <button class="add" onclick="if(confirm('Svuotare la scheda e iniziarne una nuova?')){ls('draft','');location.reload()}">Nuova scheda (svuota)</button>`;
}
function mk() {
  if (!p.c.trim()) { alert('Scrivi nome e cognome del cliente'); return; }
  const q = { c: p.c.trim(), k: p.k.trim(), t: p.t, a: p.a.replace(p.t == 'w' ? /\D/g : /\s/g, ''), id: p.id, d: p.d.map(d => ({ n: d.n, e: d.e.filter(x => x[0].trim()) })) };
  U = base() + '#p=' + enc(q);
  const m = 'Ciao! Ecco la tua scheda di allenamento: ' + U;
  $('#out').innerHTML = `<textarea readonly onclick="this.select()">${U}</textarea><div class="row"><button class="go" onclick="navigator.clipboard.writeText(U).then(()=>alert('Link copiato'))">Copia</button><a class="go" target="_blank" href="https://wa.me/?text=${encodeURIComponent(m)}">WhatsApp</a><a class="go" href="mailto:?subject=${encodeURIComponent('La tua scheda')}&body=${encodeURIComponent(m)}">Email</a></div>`;
}

/* ---------- VISTA CLIENTE ---------- */
function client(q) {
  const K = 'sc_' + q.id; let S;
  try { S = JSON.parse(ls(K)); } catch (e) { S = null; }
  S = S || { w: 1, log: {} };
  const save = () => ls(K, JSON.stringify(S));
  const show = () => {
    const L = S.log[S.w] || {};
    app.innerHTML = head(q.k) + `<h2>Scheda di ${esc(q.c)}</h2><div class="row wk"><button data-a="pw">‹</button><b>Settimana ${S.w}</b><button data-a="nw">›</button></div>`
    + q.d.map((d, i) => `<div class="card"><h3>${esc(d.n)}</h3>` + d.e.map((x, j) => {
      const v = L[i + '_' + j] || [];
      return `<div class="ex"><b>${esc(x[0])}</b> <span class="tag">${esc(x[1])}</span> <span class="m">${x[2]}×${esc(x[3])}</span><div class="row" style="margin-top:6px">`
        + Array.from({ length: x[2] }, (_, s) => `<input type="number" inputmode="decimal" placeholder="kg" value="${v[s] == null ? '' : v[s]}" data-k="${i}_${j}" data-s="${s}">`).join('') + `</div></div>`;
    }).join('') + `</div>`).join('')
    + `<button class="go" data-a="rp">Invia report al coach</button><p class="m">I carichi restano salvati su questo telefono: riapri sempre questo link.</p>`;
  };
  app.oninput = e => {
    const t = e.target; if (!t.dataset.k) return;
    const L = S.log[S.w] = S.log[S.w] || {}, a = L[t.dataset.k] = L[t.dataset.k] || [];
    a[+t.dataset.s] = t.value === '' ? null : +t.value; save();
  };
  app.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a == 'pw' && S.w > 1) S.w--;
    if (a == 'nw') S.w++;
    if (a == 'pw' || a == 'nw') { save(); show(); }
    if (a == 'rp') rep();
  };
  function rep() {
    const v = {};
    Object.keys(S.log).forEach(w => {
      const o = {};
      Object.keys(S.log[w]).forEach(k => {
        const [i, j] = k.split('_'), x = q.d[i] && q.d[i].e[j]; if (!x) return;
        const t = S.log[w][k].reduce((s, kg) => s + (kg || 0) * (parseInt(x[3]) || 0), 0);
        if (t) o[x[1]] = (o[x[1]] || 0) + Math.round(t);
      });
      if (Object.keys(o).length) v[w] = o;
    });
    if (!Object.keys(v).length) { alert('Inserisci prima qualche carico'); return; }
    const u = base() + '#r=' + enc({ c: q.c, k: q.k, v }), m = `Report settimana ${S.w} di ${q.c}: ${u}`;
    location.href = q.t == 'e'
      ? `mailto:${q.a}?subject=${encodeURIComponent('Report allenamento ' + q.c)}&body=${encodeURIComponent(m)}`
      : `https://wa.me/${q.a}?text=${encodeURIComponent(m)}`;
  }
  show();
}

/* ---------- REPORT (coach) ---------- */
function report(r) {
  const W = Object.keys(r.v).map(Number).sort((a, b) => a - b), M = [...new Set(W.flatMap(w => Object.keys(r.v[w])))];
  app.innerHTML = head(r.k) + `<h2>Report di ${esc(r.c)}</h2><p class="m">Volume = serie × ripetizioni × carico, per gruppo muscolare. S1, S2... sono le settimane.</p>`
  + M.map(m => {
    const vals = W.map(w => r.v[w][m] || 0), mx = Math.max(...vals, 1), n = vals.length, l = vals[n - 1], pr = vals[n - 2];
    let b = '<span class="tg n">prima settimana</span>';
    if (n > 1 && pr) { const d = (l - pr) / pr * 100; b = d >= 2 ? `<span class="tg u">▲ +${d.toFixed(0)}%</span>` : d <= -2 ? `<span class="tg d">▼ ${d.toFixed(0)}%</span>` : '<span class="tg n">= invariato</span>'; }
    return `<div class="card"><div class="row"><b>${esc(m)}</b>${b}</div><div class="bars">` + vals.map((x, i) => `<div class="bar"><i style="height:${Math.round(x / mx * 70) + 4}px"></i><small>${x}</small><small>S${W[i]}</small></div>`).join('') + `</div></div>`;
  }).join('');
}

/* ---------- AVVIO ---------- */
addEventListener('hashchange', () => location.reload());
try {
  const h = location.hash;
  if (h.startsWith('#p=')) client(dec(h.slice(3)));
  else if (h.startsWith('#r=')) report(dec(h.slice(3)));
  else creator();
} catch (e) { app.innerHTML = '<p>Link non valido.</p>'; }
</script>
</body>
